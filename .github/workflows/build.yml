name: Build ESP32

on:
  push:
    branches: ['**']
    tags: ['v*']                         # Tag v1.2.3 pushen -> GitHub-Release
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: esp32                 # klassischer ESP32 DevKit
            fqbn: esp32:esp32:esp32
          # - board: esp32s3             # weitere Boards bei Bedarf
          #   fqbn: esp32:esp32:esp32s3

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      # ESP32-Core cachen (ca. 1 GB, spart mehrere Minuten pro Build)
      - uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-${{ hashFiles('.github/workflows/build.yml') }}

      - name: ESP32-Core installieren
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          # feste Version: arduino-cli core install esp32:esp32@3.1.1

      - name: Bibliotheken installieren
        run: |
          # Beispiele – an deine Includes anpassen:
          # arduino-cli lib install "MIDI Library"
          # arduino-cli lib install "Adafruit SSD1306"
          true

      - name: Kompilieren
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --warnings default \
            --output-dir build \
            esp32MiniSynth

      # esp32MiniSynth.ino.merged.bin -> esp32MiniSynth-esp32.merged.bin usw.,
      # damit sich die Dateien mehrerer Boards im Release nicht überschreiben
      - name: Dateien umbenennen
        run: |
          for f in build/esp32MiniSynth.ino*.bin; do
            mv "$f" "build/esp32MiniSynth-${{ matrix.board }}${f#build/esp32MiniSynth.ino}"
          done
          ls -l build/*.bin

      - name: Firmware hochladen
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: build/*.bin

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
