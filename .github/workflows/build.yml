name: Build ESP32

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fqbn:
          - esp32:esp32:esp32            # klassischer ESP32 DevKit
          # - esp32:esp32:esp32s3        # weitere Boards bei Bedarf

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      # ESP32-Core cachen (ca. 1 GB, spart mehrere Minuten pro Build)
      - uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-${{ hashFiles('.github/workflows/build.yml') }}

      - name: ESP32-Core installieren
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          # feste Version: arduino-cli core install esp32:esp32@3.1.1

      - name: Bibliotheken installieren
        run: |
          # Beispiele – an deine Includes anpassen:
          # arduino-cli lib install "MIDI Library"
          # arduino-cli lib install "Adafruit SSD1306"
          true

      - name: Kompilieren
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --warnings default \
            --output-dir build \
            esp32MiniSynth

      - name: Firmware hochladen
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ strategy.job-index }}
          path: build/*.bin
